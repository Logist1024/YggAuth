name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.27"
  NODE_VERSION: "24"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build backend
        run: make build-go

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: yggauth
          path: bin/yggauth

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: Unit tests
        run: make test

      - name: Integration tests
        run: make test-integration

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          # 必须选**用 Go 1.27 构建**的版本。go.mod 声明 go 1.27,而 golangci-lint
          # 拒绝分析目标版本高于自身构建版本的代码,直接报:
          #   can't load config: the Go language version (go1.25) used to build
          #   golangci-lint is lower than the targeted Go version (1.27)
          # 这个失败发生在**加载配置阶段**,一行代码都还没扫 —— 报错信息里
          # 没有任何文件名,不查版本号根本看不出是版本不匹配。
          #
          # v2.13.0(2026-08-19)起改用 Go 1.27 构建。升级时先确认:
          #   golangci-lint version   # 输出里有 "built with go1.27.x"
          version: v2.14.0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Frontend lint
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm lint

      - name: sqlc generated code is up to date
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.30.0
          make sqlc-diff

      - name: Term gate (ADR-010)
        run: make check-terms

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...