# golangci-lint v2 配置
# 依据 docs/01-roadmap.md M0:gofumpt + errcheck + staticcheck 为必需项。
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # standard = errcheck + govet + ineffassign + staticcheck + unused
  default: standard
  enable:
    - revive         # 命名与可读性
    - misspell       # 拼写
    - unconvert      # 无意义的类型转换
    - bodyclose      # http response body 未关闭
    - noctx          # 缺少 context 的 HTTP 请求
    - prealloc       # slice 可预分配
    - errorlint      # 错误比较要用 errors.Is
    - nilerr         # return nil 前忽略了 err
    - copyloopvar    # Go 1.22+ 循环变量捕获
    # 说明:没有启用 godot —— 它的规则是「注释句末必须是半角句号」,
    # 与本项目中文注释风格冲突,强行启用只会催生无意义的标点。
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
        - name: package-comments
          disabled: true
        - name: var-naming
          disabled: false
    misspell:
      locale: US
  exclusions:
    rules:
      # 测试文件放宽 errcheck 与未使用检查
      - path: _test\.go
        linters:
          - errcheck
          - unused
      # 生成物不检查
      - path: internal/platform/db/query/
        linters:
          - all
      # handler 里未使用参数很常见,单独放宽
      #
      # 这条原先写在 issues.exclude-rules 下 —— 那是 v1 的位置。
      # v2 把排除规则统一收进 linters.exclusions.rules。v2.6.2 还不校验 schema,
      # 到 v2.14.0 的 `config verify` 会直接拒绝整个配置,报「含有非法元素」
      # 却不指出是哪个键,看着像配置本身写坏了。
      - linters:
          - revive
        text: "unused-parameter"

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yggauth/yggauth

issues:
  max-issues-per-linter: 0
  max-same-issues: 0