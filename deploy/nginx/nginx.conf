# nginx 主配置。
#
# 刻意保持精简:反向代理这一层只做三件事 —— TLS 终止、
# 真实 IP 透传、以及把请求体大小的限制交给应用自己判断。
# 任何在这里自作聪明的重写规则都会在半年后变成排查噩梦。

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志里记真实 IP 而不是 $proxy_host —— 否则出问题时你只会看到
    # 一堆 172.18.0.x,排查「谁在刷接口」无从下手。
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # 上传上限。与 MC_SKIN_MAX_SIZE 对齐,留一点余量给 multipart 开销。
    # 在 nginx 层就挡住 2MB 以上的皮肤上传,应用根本收不到。
    client_max_body_size 4m;
    client_body_timeout  30s;

    # 隐藏版本号:没有攻击价值,但零成本。
    server_tokens off;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_vary         on;
    # 已经压缩过的格式再压一遍只会浪费 CPU。
    gzip_types        application/javascript application/json application/xml
                      text/css text/plain image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
