# YggAuth 的站点配置。
#
# HTTP 与 HTTPS 并存:HTTPS 是主入口,HTTP 只做两件事 ——
# ACME 质询,以及把其余请求 301 到 HTTPS。
#
# **不要**在 HTTP 上直接代理业务:明文传输的密码与令牌等于没加密,
# 而浏览器不会因为「反正会跳 HTTPS」就先把凭据发出来。

# ACME 质询单独一个 server:它必须能被无证书的明文 HTTP 访问。
server {
    listen 80;
    listen [::]:80;
    server_name logist.eu.cc;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name logist.eu.cc;

    ssl_certificate     /etc/letsencrypt/live/logist.eu.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logist.eu.cc/privkey.pem;

    # TLS 1.2/1.3。1.0/1.1 已被主流浏览器弃用,留着只会扩大攻击面。
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # HSTS。max-age 起步就是一年 —— 缩短它没有安全收益,
    # 只会让用户在策略改动时更难恢复。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 应用自己也设了一组安全头,两边重复设是允许的:
    # 头同名时 nginx 的会覆盖应用的,两者内容一致所以无害。
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # 透传真实 IP。应用据此做限流与审计 —— 没有这三行,
    # 所有请求在应用看来都来自同一个代理地址,限流会误伤所有人。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 应用自己管 WebSocket 与长连接,这里不设 Upgrade:
    # 把 upgrade 头映射到 /mc 之类的协议路径上会造成握手失败。

    # 就绪与存活探针:转发但不记访问日志。
    # 每 30 秒一条的探针会把访问日志淹掉,而访问日志恰恰是
    # 出事时唯一能看清「谁在做什么」的东西。
    location = /health/ready {
        access_log off;
        proxy_pass http://app:3000;
    }

    location = /health/live {
        access_log off;
        proxy_pass http://app:3000;
    }

    # metrics 不对外暴露。它含内部路径与请求量,
    # 是给监控系统看的,不是给公网看的。
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://app:3000;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
