# YggAuth 测试环境的站点配置。
#
# 与 deploy/nginx/conf.d/yggauth.conf 的差异只有三处,其余保持一致 ——
# 差异越小,测试环境验出来的东西越接近生产:
#
#   1. 证书来自 /etc/nginx/certs(宿主机自签),不是 Let's Encrypt。
#   2. 关掉 OCSP stapling。自签证书没有 OCSP 响应,
#      stapling 开着会让 nginx 启动或握手时反复告警。
#   3. HTTP 不跳 301,直接代理。明文入口保留下来,
#      这样同一份配置既能验 https 也能验 http。
#
# ⚠️ 这里没有生产配置里的 301 跳转:测试环境要的是
#    「两种协议都能随手验」,不是「强制收敛到一种」。
#    缺了这个跳转本身就是一处差异,升级到生产前要把它补回去。

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location = /health/ready {
        access_log off;
        proxy_pass http://app:3000;
    }

    location = /health/live {
        access_log off;
        proxy_pass http://app:3000;
    }

    # metrics 不对外暴露。它含内部路径与请求量,
    # 是给监控系统看的,不是给测试同学随手翻的。
    # 测试环境要看它,直连 app 容器端口(见 docs/10-test-deployment.md 第四节)。
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://app:3000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # server_name 写 _ 是为了配合 hosts 文件使用:
    # 证书签给哪个名字,访问时就用哪个名字,
    # 不必为了换域名回来改这个文件。代价是证书与主机名不匹配时
    # 浏览器会告警 —— 正式联调域名请改回具体名字。
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 生产配置里这里是 stapling on + stapling_verify on。
    # 自签证书没有可用的 OCSP 响应,开着只会刷无意义的告警。
    # 用 Let's Encrypt 的预发环境应当把它改回去。

    add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # 透传真实 IP。应用据此做限流与审计 ——
    # 少这三行,所有请求在应用看来都来自同一个代理地址,限流会误伤所有人。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location = /health/ready {
        access_log off;
        proxy_pass http://app:3000;
    }

    location = /health/live {
        access_log off;
        proxy_pass http://app:3000;
    }

    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://app:3000;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}