# 测试环境编排覆盖层。
#
# 用法(不要单独运行,必须叠加在根 compose 之上):
#
#   cp deploy/test/test.env.example .env.test      # *.test 规则会挡住它
#   docker compose -p yggauth-test \
#     --env-file .env.test \
#     -f docker-compose.yml \
#     -f deploy/test/docker-compose.test.yml up -d --build
#
# 为什么要覆盖而不是直接改 docker-compose.yml:
# 根编排是生产形态(强制 HTTPS、Secure cookie、信任反代头),
# 那套默认值在测试机上既跑不起来也不该跑。这里只做差异,
# 生产编排保持原样,两边不会互相污染。
#
# 三条取舍:
#   1. nginx 默认不启动(见下方 profiles)。测试环境没有公网域名,
#      证书只会挡路。直连 app 端口更快,排障时少一层跳转。
#   2. TRUST_PROXY_HEADERS 默认改回 false。直连时没有可信反代,
#      开着等于让任何人都能伪造 X-Forwarded-For 污染审计日志。
#   3. 补齐根编排没有透传的配置项。根编排的 environment 是白名单,
#      没写进去的变量在 .env 里配了也不生效 —— 见下方「根编排未透传」注释块。

services:
  app:
    # ------------------------------------------------------------------ 端口
    # 只绑 127.0.0.1:测试环境的凭据不具备生产强度,
    # 绑到 0.0.0.0 等于把它挂到整个内网上。需要从别的机器访问时,
    # 改成 "0.0.0.0:${TEST_PORT:-3000}:3000" 并自行评估风险。
    ports:
      - "127.0.0.1:${TEST_PORT:-3000}:3000"

    environment:
      # 直连模式下没有可信反代。
      TRUST_PROXY_HEADERS: "${TRUST_PROXY_HEADERS:-false}"

      # 测试环境默认走明文 HTTP,所以 Secure 必须为 false。
      # 注意这不是「关掉安全」而是「配成与协议一致」:
      # 应用在 PUBLIC_BASE_URL 是 http 且非 localhost 时会拒绝启动,
      # 详见 internal/config/config.go validate() 的最后一段。
      SSO_COOKIE_SECURE: "${SSO_COOKIE_SECURE:-false}"

      # ------------------------------------------------------------------
      # 以下变量根编排没有透传。compose 的 environment 是白名单语义:
      # .env 里配了但这里没写的,容器里就是不存在。
      # 根编排只覆盖了部署必需的那几十项,日志级别、注册策略、
      # 密码与会话策略这些「测试时最常调」的全在下面。
      # ------------------------------------------------------------------
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      LOG_FORMAT: "${LOG_FORMAT:-text}"
      LOG_ADD_SOURCE: "${LOG_ADD_SOURCE:-true}"
      # ⚠️ 仍然保持 false:打开会把请求体(含密码明文)写进日志。
      # 测试环境的数据量小,关掉它省下的那点日志不抵一次泄露。
      LOG_REQUEST_BODY: "${LOG_REQUEST_BODY:-false}"
      LOG_SLOW_REQUEST: "${LOG_SLOW_REQUEST:-1s}"

      REGISTRATION_MODE: "${REGISTRATION_MODE:-open}"
      PASSWORD_MIN_LENGTH: "${PASSWORD_MIN_LENGTH:-8}"
      PASSWORD_MAX_LENGTH: "${PASSWORD_MAX_LENGTH:-128}"
      PASSWORD_REJECT_COMMON: "${PASSWORD_REJECT_COMMON:-true}"
      # 留空不会「关闭」泄露检查:reader 把空串当未设置,会回落到默认值。
      # 事实上当前装配里 LeakChecker 根本没被注入,检查一律不执行(见文档第九节)。
      HIBP_ENDPOINT: "${HIBP_ENDPOINT:-https://api.pwnedpasswords.com/range}"

      LOGIN_MAX_FAILED_ATTEMPTS: "${LOGIN_MAX_FAILED_ATTEMPTS:-5}"
      LOGIN_LOCK_SECONDS: "${LOGIN_LOCK_SECONDS:-900}"
      SESSION_IDLE_TTL: "${SESSION_IDLE_TTL:-168h}"
      SESSION_MAX_TTL: "${SESSION_MAX_TTL:-720h}"
      SESSION_COOKIE_NAME: "${SESSION_COOKIE_NAME:-ygg_session}"

      OIDC_REQUIRE_PKCE: "${OIDC_REQUIRE_PKCE:-true}"
      OIDC_ACCESS_TOKEN_TTL: "${OIDC_ACCESS_TOKEN_TTL:-1h}"
      OIDC_REFRESH_TOKEN_TTL: "${OIDC_REFRESH_TOKEN_TTL:-720h}"
      SSO_COOKIE_NAME: "${SSO_COOKIE_NAME:-ygg_sso}"

      MC_READONLY: "${MC_READONLY:-false}"
      MC_SKIN_EXTERNAL: "${MC_SKIN_EXTERNAL:-false}"
      MC_SKIN_EXTERNAL_BASE_URL: "${MC_SKIN_EXTERNAL_BASE_URL:-}"
      MC_SKIN_MAX_SIZE_MB: "${MC_SKIN_MAX_SIZE_MB:-2}"
      MC_NAME_RETENTION_DAYS: "${MC_NAME_RETENTION_DAYS:-90}"

      MAILER_FROM_NAME: "${MAILER_FROM_NAME:-YggAuth (test)}"

      # ⚠️ 这里必须是 SMTP_USER,不是 SMTP_USERNAME。
      # 应用读的键名是 SMTP_USER(internal/config/config.go Load()),
      # 而根编排透传的是 SMTP_USERNAME —— 两者对不上,
      # 导致 MAILER_TRANSPORT=smtp 时应用永远读到空用户名并拒绝启动。
      # 详见 docs/10-test-deployment.md 第九节。
      SMTP_TLS: "${SMTP_TLS:-true}"
      SMTP_USER: "${SMTP_USER:-}"

  nginx:
    # profile 门控:默认不启动。启用方式见 docs/10-test-deployment.md 路线 C。
    profiles: ["tls"]

    volumes:
      # 只换站点配置:main nginx.conf 里没有证书路径,可以原样复用生产的。
      # 自签证书在宿主机上签好后挂进来,nginx 容器不需要访问 Let's Encrypt。
      #
      # 合并规则:compose 的 volumes 按**挂载目标**去重,
      # 同目标的条目以本文件为准,所以下面两条会替换掉根编排里的同名挂载。
      # certbot 那两个卷留在原地但不再被引用 —— 删掉它们会让
      # 「根编排声明的卷」与「实际运行的卷」对不上,不如留着无害。
      - ./deploy/test/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/test/certs:/etc/nginx/certs:ro